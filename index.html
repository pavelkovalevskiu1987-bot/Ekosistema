<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Экосистема: Входные и Межкомнатные двери</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Изоляция печати: при выводе на принтер скрывается весь интерфейс, кроме печатного шлюза */
    @media print {
      #app-ui-root { display: none !important; }
      #app-print-root { display: block !important; width: 100%; margin: 0; padding: 0; }
      @page { size: A4; margin: 10mm; }
      body { background: #fff !important; color: #000 !important; }
    }
    @media screen {
      #app-print-root { display: none; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <!-- ИНТЕРФЕЙС ПРИЛОЖЕНИЯ (Скрывается при печати) -->
  <div id="app-ui-root" class="flex flex-col min-h-screen">
    
    <!-- Верхняя панель: Выбор клиента и Бэкап -->
    <header class="bg-slate-900 text-white px-4 py-3 shadow-md flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <span class="font-bold text-lg tracking-wide text-amber-400">DOOR ECOSYSTEM</span>
        <select id="project-selector" class="bg-slate-800 border border-slate-700 text-sm rounded px-3 py-1.5 text-white">
          <!-- Заполняется автоматически -->
        </select>
        <button onclick="AppCore.createNewProject()" class="bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold px-3 py-1.5 rounded transition">
          + Новый клиент
        </button>
      </div>

      <div class="flex items-center gap-2 text-xs">
        <button onclick="AppCore.exportCurrentProject()" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded">
          Скачать JSON
        </button>
        <label class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded cursor-pointer">
          Загрузить JSON
          <input type="file" accept=".json" class="hidden" onchange="AppCore.importProject(event)">
        </label>
        <button onclick="AppCore.deleteCurrentProject()" class="bg-rose-700 hover:bg-rose-600 px-3 py-1.5 rounded ml-2">
          Удалить
        </button>
      </div>
    </header>

    <!-- Навигация по веткам и блокам -->
    <nav class="bg-white border-b border-slate-200 px-4 py-2 shadow-sm">
      <div class="flex flex-wrap items-center gap-1.5" id="nav-tabs">
        <!-- Кнопки навигации рендерятся ядром автоматически -->
      </div>
    </nav>

    <!-- Рабочая область: Изолированные контейнеры для всех 11 блоков -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4">
      <div id="slot-client" class="block-slot"></div>
      
      <!-- Ветка 1: Входные двери -->
      <div id="slot-ext_measure" class="block-slot hidden"></div>
      <div id="slot-ext_invoice" class="block-slot hidden"></div>
      <div id="slot-ext_contract" class="block-slot hidden"></div>
      <div id="slot-ext_act" class="block-slot hidden"></div>

      <!-- Ветка 2: Межкомнатные двери -->
      <div id="slot-int_measure" class="block-slot hidden"></div>
      <div id="slot-int_calc" class="block-slot hidden"></div>
      <div id="slot-int_invoice" class="block-slot hidden"></div>
      <div id="slot-int_contract" class="block-slot hidden"></div>
      <div id="slot-int_factory" class="block-slot hidden"></div>
      <div id="slot-int_act" class="block-slot hidden"></div>
    </main>
  </div>

  <!-- ИЗОЛИРОВАННЫЙ ШЛЮЗ ДЛЯ ПЕЧАТИ ДОКУМЕНТОВ А4 -->
  <div id="app-print-root"></div>

  <!-- ЯДРО ЭКОСИСТЕМЫ (НЕ ТРОГАТЬ ПРИ РАЗРАБОТКЕ БЛОКОВ) -->
  <script>
    const STORAGE_KEY = 'DOOR_ECOSYSTEM_PROJECTS_V1';

    const BLOCK_CONFIG = [
      { id: 'client',       branch: 'common',   title: '1. Карточка клиента' },
      // Ветка 1: Входные
      { id: 'ext_measure',  branch: 'entrance', title: '2. Замер ВД' },
      { id: 'ext_invoice',  branch: 'entrance', title: '3. Счёт-фактура ВД' },
      { id: 'ext_contract', branch: 'entrance', title: '4. Договор ВД' },
      { id: 'ext_act',      branch: 'entrance', title: '5. Акт ВД' },
      // Ветка 2: Межкомнатные
      { id: 'int_measure',  branch: 'interior', title: '6. Замер МД' },
      { id: 'int_calc',     branch: 'interior', title: '7. Расчёт и КП' },
      { id: 'int_invoice',  branch: 'interior', title: '8а. Счёт-фактура МД' },
      { id: 'int_contract', branch: 'interior', title: '8б. Договор МД' },
      { id: 'int_factory',  branch: 'interior', title: '9. Заявка на фабрику' },
      { id: 'int_act',      branch: 'interior', title: '10. Акт МД' }
    ];

    window.AppModules = {};

    window.AppCore = {
      projects: {},
      currentId: null,
      activeTab: 'client',

       createDefaultSchema(id) {
        return {
          id: id,
          updatedAt: new Date().toISOString(),
          client: {
            fullName: '', phone: '', address: '', floor: '',
            hasElevator: false, elevatorType: 'none', // none | passenger | cargo
            passport: { series: '', number: '', issuedBy: '', issuedDate: '', idNumber: '', registration: '' },
            orderType: 'both' // entrance | interior | both
          },
          ext_measure: {},
          ext_invoice: {},
          ext_contract: {},
          ext_act: {},
          int_measure: { openings: [] },
          int_calc: { items: [], totals: {} },
          int_invoice: {},
          int_contract: {},
          int_factory: {},
          int_act: {}
        };
      },

      init() {
        const raw = localStorage.getItem(STORAGE_KEY);
        this.projects = raw ? JSON.parse(raw) : {};
        const ids = Object.keys(this.projects);
        if (ids.length === 0) {
          this.createNewProject();
        } else {
          this.currentId = ids[0];
          this.refreshUI();
        }
      },

      saveToDisk() {
        if (this.currentId && this.projects[this.currentId]) {
          this.projects[this.currentId].updatedAt = new Date().toISOString();
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(this.projects));
        this.renderProjectSelector();
      },

      getState(sectionKey) {
        const proj = this.projects[this.currentId];
        if (!proj) return {};
        return sectionKey ? (proj[sectionKey] || {}) : proj;
      },

      updateState(sectionKey, newData) {
        const proj = this.projects[this.currentId];
        if (!proj) return;
        proj[sectionKey] = { ...proj[sectionKey], ...newData };
        this.saveToDisk();
        if (sectionKey === 'client') this.renderNavTabs();
        window.dispatchEvent(new CustomEvent('ecosystem:stateChanged', {
          detail: { section: sectionKey, state: proj }
        }));
      },

      registerModule(blockId, moduleObj) {
        window.AppModules[blockId] = moduleObj;
      },

      switchTab(blockId) {
        this.activeTab = blockId;
        document.querySelectorAll('.block-slot').forEach(el => el.classList.add('hidden'));
        const targetSlot = document.getElementById(`slot-${blockId}`);
        if (targetSlot) {
          targetSlot.classList.remove('hidden');
          const mod = window.AppModules[blockId];
          if (mod && typeof mod.render === 'function') {
            mod.render(targetSlot, this.getState());
          } else {
            targetSlot.innerHTML = `
              <div class="bg-white p-8 rounded-lg shadow border border-slate-200 text-center">
                <h2 class="text-xl font-bold text-slate-700 mb-2">Модуль «${blockId}» ещё не подключён</h2>
                <p class="text-sm text-slate-500">Сгенерируйте скрипт этого блока и вставьте его в низ файла index.html.</p>
              </div>`;
          }
        }
        this.renderNavTabs();
      },

      printHtml(htmlContent) {
        const printRoot = document.getElementById('app-print-root');
        printRoot.innerHTML = htmlContent;
        setTimeout(() => { window.print(); }, 150);
      },

      createNewProject() {
        const id = 'proj_' + Date.now();
        this.projects[id] = this.createDefaultSchema(id);
        this.currentId = id;
        this.saveToDisk();
        this.switchTab('client');
      },

      deleteCurrentProject() {
        if (!confirm('Удалить текущего клиента и все его документы?')) return;
        delete this.projects[this.currentId];
        const ids = Object.keys(this.projects);
        if (ids.length === 0) {
          this.createNewProject();
        } else {
          this.currentId = ids[0];
          this.saveToDisk();
          this.refreshUI();
        }
      },

      renderProjectSelector() {
        const sel = document.getElementById('project-selector');
        sel.innerHTML = Object.values(this.projects).map(p => {
          const name = p.client?.fullName?.trim() || 'Новый клиент (без имени)';
          const addr = p.client?.address ? ` — ${p.client.address}` : '';
          return `<option value="${p.id}" ${p.id === this.currentId ? 'selected' : ''}>${name}${addr}</option>`;
        }).join('');
        sel.onchange = (e) => {
          this.currentId = e.target.value;
          this.refreshUI();
        };
      },

      renderNavTabs() {
        const nav = document.getElementById('nav-tabs');
        const orderType = this.getState('client')?.orderType || 'both';
        
        nav.innerHTML = BLOCK_CONFIG.filter(b => {
          if (b.branch === 'common') return true;
          if (orderType === 'both') return true;
          return b.branch === orderType;
        }).map(b => {
          const isActive = this.activeTab === b.id;
          const branchColor = b.branch === 'common' 
            ? (isActive ? 'bg-slate-900 text-white' : 'bg-slate-200 text-slate-700 hover:bg-slate-300')
            : b.branch === 'entrance'
              ? (isActive ? 'bg-blue-700 text-white' : 'bg-blue-50 text-blue-800 border border-blue-200 hover:bg-blue-100')
              : (isActive ? 'bg-amber-600 text-white' : 'bg-amber-50 text-amber-900 border border-amber-200 hover:bg-amber-100');
          return `<button onclick="AppCore.switchTab('${b.id}')" class="px-3 py-1.5 rounded text-xs font-semibold transition ${branchColor}">${b.title}</button>`;
        }).join('');
      },

      refreshUI() {
        this.renderProjectSelector();
        this.switchTab(this.activeTab);
      },

      exportCurrentProject() {
        const proj = this.getState();
        const name = (proj.client?.fullName || 'client').replace(/\s+/g, '_');
        const blob = new Blob([JSON.stringify(proj, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `${name}_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
      },

      importProject(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            const id = data.id || ('proj_' + Date.now());
            data.id = id;
            this.projects[id] = data;
            this.currentId = id;
            this.saveToDisk();
            this.refreshUI();
          } catch (err) {
            alert('Ошибка чтения JSON файла');
          }
        };
        reader.readAsText(file);
      }
    };

    window.addEventListener('DOMContentLoaded', () => AppCore.init());
  </script>
<script>
(function() {
  AppCore.registerModule('client', {
    render(container, fullState) {
      const c = fullState.client || {};
      const p = c.passport || {};
      const orderType = c.orderType || 'both';
      const elevatorType = c.elevatorType || 'none';

      container.innerHTML = `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 md:p-6 max-w-4xl mx-auto">
          
          <!-- Заголовок и статус сохранения -->
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-4 mb-6">
            <div>
              <h2 class="text-xl font-bold text-slate-800">1. Карточка клиента</h2>
              <p class="text-xs text-slate-500 mt-0.5">Общие данные для всех веток, замеров, счетов-фактур и договоров</p>
            </div>
            <span id="client-save-badge" class="text-xs font-medium text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-1 rounded-full opacity-0 transition-opacity duration-300">
              ✓ Сохранено в базу
            </span>
          </div>

          <!-- Выбор ветки заказа -->
          <div class="mb-6">
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">Направление заказа (активные ветки)</label>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5" id="client-order-type-group">
              <button type="button" data-branch="entrance"
                class="branch-btn py-2.5 px-3 rounded-lg border text-sm font-semibold transition flex items-center justify-center gap-2 ${orderType === 'entrance' ? 'bg-blue-600 text-white border-blue-600 shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}">
                🚪 Только входные
              </button>
              <button type="button" data-branch="interior"
                class="branch-btn py-2.5 px-3 rounded-lg border text-sm font-semibold transition flex items-center justify-center gap-2 ${orderType === 'interior' ? 'bg-amber-600 text-white border-amber-600 shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}">
                🏠 Только межкомнатные
              </button>
              <button type="button" data-branch="both"
                class="branch-btn py-2.5 px-3 rounded-lg border text-sm font-semibold transition flex items-center justify-center gap-2 ${orderType === 'both' ? 'bg-slate-900 text-white border-slate-900 shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'}">
                🔄 Входные + Межкомнатные
              </button>
            </div>
          </div>

          <!-- Контакты и Адрес объекта -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            
            <!-- ФИО -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">ФИО клиента полностью</label>
              <input type="text" id="f-fullName" value="${this.esc(c.fullName)}" placeholder="Иванов Иван Иванович"
                class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none">
            </div>

            <!-- Телефон + Кнопка позвонить -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Номер телефона</label>
              <div class="flex gap-2">
                <input type="tel" id="f-phone" value="${this.esc(c.phone)}" placeholder="+375 (29) 000-00-00"
                  class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none">
                <a id="btn-call-phone" href="${this.getTelHref(c.phone)}"
                  class="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-2 rounded-lg text-sm font-semibold flex items-center gap-1.5 shrink-0 transition shadow-sm ${c.phone ? '' : 'opacity-50 pointer-events-none'}">
                  <span>📞</span> <span class="hidden sm:inline">Позвонить</span>
                </a>
              </div>
            </div>

            <!-- Адрес + Кнопка Яндекс Карты -->
            <div class="md:col-span-2">
              <label class="block text-xs font-semibold text-slate-600 mb-1">Адрес объекта (установки)</label>
              <div class="flex gap-2">
                <input type="text" id="f-address" value="${this.esc(c.address)}" placeholder="г. Борисов, ул. Дёмина, д. 39, кв. 1"
                  class="flex-1 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none">
                <a id="btn-yandex-map" href="${this.getMapHref(c.address)}" target="_blank" rel="noopener noreferrer"
                  class="bg-amber-500 hover:bg-amber-400 text-slate-950 px-3.5 py-2 rounded-lg text-sm font-semibold flex items-center gap-1.5 shrink-0 transition shadow-sm ${c.address ? '' : 'opacity-50 pointer-events-none'}">
                  <span>📍</span> <span class="hidden sm:inline">Яндекс Карты</span>
                </a>
              </div>
            </div>

            <!-- Этаж -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Этаж</label>
              <input type="text" id="f-floor" value="${this.esc(c.floor)}" placeholder="Например: 4 (или Частный дом)"
                class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none">
            </div>

            <!-- Лифт и его тип -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Наличие и тип лифта</label>
              <select id="f-elevatorType" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-slate-900 focus:outline-none">
                <option value="none" ${elevatorType === 'none' ? 'selected' : ''}>Без лифта</option>
                <option value="passenger" ${elevatorType === 'passenger' ? 'selected' : ''}>Пассажирский лифт</option>
                <option value="cargo" ${elevatorType === 'cargo' ? 'selected' : ''}>Грузовой лифт</option>
              </select>
            </div>
          </div>

          <!-- Паспортные данные -->
          <div class="border-t border-slate-200 pt-5">
            <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider mb-3">Паспортные данные (для договора и банка)</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <!-- Серия и номер паспорта -->
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Серия и номер паспорта</label>
                <input type="text" id="f-passportNumber" value="${this.esc(p.seriesNumber || ((p.series || '') + (p.number || '')))}" placeholder="MC 1234567"
                  class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm uppercase focus:ring-2 focus:ring-slate-900 focus:outline-none">
              </div>

              <!-- Дата выдачи -->
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Дата выдачи документа</label>
                <input type="date" id="f-issuedDate" value="${this.esc(p.issuedDate)}"
                  class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none">
              </div>

              <!-- Кем выдан -->
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Орган, выдавший документ</label>
                <input type="text" id="f-issuedBy" value="${this.esc(p.issuedBy)}" placeholder="Борисовским РУВД Минской обл."
                  class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none">
              </div>

              <!-- Место прописки -->
              <div class="md:col-span-3">
                <div class="flex items-center justify-between mb-1">
                  <label class="block text-xs font-semibold text-slate-600">Место прописки (регистрации) по паспорту</label>
                  <button type="button" id="btn-copy-address" class="text-xs text-blue-600 hover:text-blue-800 font-medium">
                    Скопировать из адреса объекта ↑
                  </button>
                </div>
                <input type="text" id="f-registration" value="${this.esc(p.registration)}" placeholder="г. Борисов, ул. ..."
                  class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-slate-900 focus:outline-none">
              </div>
            </div>
          </div>

        </div>
      `;

      this.bindEvents(container);
    },

    bindEvents(container) {
      let currentOrderType = AppCore.getState('client').orderType || 'both';

      const collectAndSave = () => {
        const fullName = container.querySelector('#f-fullName').value.trim();
        const phone = container.querySelector('#f-phone').value.trim();
        const address = container.querySelector('#f-address').value.trim();
        const floor = container.querySelector('#f-floor').value.trim();
        const elevatorType = container.querySelector('#f-elevatorType').value;
        const seriesNumber = container.querySelector('#f-passportNumber').value.trim().toUpperCase();
        const issuedDate = container.querySelector('#f-issuedDate').value;
        const issuedBy = container.querySelector('#f-issuedBy').value.trim();
        const registration = container.querySelector('#f-registration').value.trim();

        // Обновляем живые ссылки на кнопках звонка и Яндекс.Карт
        const callBtn = container.querySelector('#btn-call-phone');
        callBtn.href = this.getTelHref(phone);
        callBtn.classList.toggle('opacity-50', !phone);
        callBtn.classList.toggle('pointer-events-none', !phone);

        const mapBtn = container.querySelector('#btn-yandex-map');
        mapBtn.href = this.getMapHref(address);
        mapBtn.classList.toggle('opacity-50', !address);
        mapBtn.classList.toggle('pointer-events-none', !address);

        AppCore.updateState('client', {
          fullName,
          phone,
          address,
          floor,
          hasElevator: elevatorType !== 'none',
          elevatorType,
          orderType: currentOrderType,
          passport: {
            seriesNumber,
            issuedDate,
            issuedBy,
            registration
          }
        });

        // Показываем индикатор сохранения
        const badge = container.querySelector('#client-save-badge');
        if (badge) {
          badge.classList.remove('opacity-0');
          clearTimeout(this._saveTimer);
          this._saveTimer = setTimeout(() => badge.classList.add('opacity-0'), 1200);
        }
      };

      // Автосохранение при вводе в любое поле
      container.querySelectorAll('input, select').forEach(input => {
        input.addEventListener('input', collectAndSave);
        input.addEventListener('change', collectAndSave);
      });

      // Переключение ветки заказа (Входные / Межкомнатные / Обе)
      container.querySelectorAll('.branch-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentOrderType = btn.dataset.branch;
          collectAndSave();
          // Перерисовываем карточку, чтобы обновить активную кнопку ветки
          this.render(container, AppCore.getState());
        });
      });

      // Кнопка быстрого копирования адреса объекта в прописку
      const copyAddrBtn = container.querySelector('#btn-copy-address');
      if (copyAddrBtn) {
        copyAddrBtn.addEventListener('click', () => {
          const addr = container.querySelector('#f-address').value;
          if (addr) {
            container.querySelector('#f-registration').value = addr;
            collectAndSave();
          }
        });
      }
    },

    getTelHref(phone) {
      if (!phone) return '#';
      const cleaned = phone.replace(/[^\d+]/g, '');
      return `tel:${cleaned}`;
    },

    getMapHref(address) {
      if (!address) return '#';
      return `https://yandex.by/maps/?text=${encodeURIComponent(address)}`;
    },

    esc(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }
  });

  // Если приложение уже загружено и открыта вкладка клиента — сразу отрисовываем
  if (window.AppCore && AppCore.activeTab === 'client') {
    AppCore.switchTab('client');

      const arcColor = active ? '#3b82f6' : '#94a3b8';
      // Координаты петель: left = x:18, right = x:62; стена по y:24
      const hx = hinge === 'left' ? 18 : 62;
      const closedX = hinge === 'left' ? 62 : 18;
      const openY = dir === 'out' ? 44 : 4; // out = вниз (наружу к себе), in = вверх (внутрь от себя)
      const sweep = (hinge === 'left' && dir === 'out') || (hinge === 'right' && dir === 'in') ? 1 : 0;

      return `
        <svg viewBox="0 0 80 48" class="w-16 h-11">
          <!-- Стена и проём -->
          <line x1="2" y1="24" x2="18" y2="24" stroke="#64748b" stroke-width="4" />
          <line x1="62" y1="24" x2="78" y2="24" stroke="#64748b" stroke-width="4" />
          <!-- Точка петли -->
          <circle cx="${hx}" cy="24" r="3.5" fill="${stroke}" />
          <!-- Полотно в открытом положении -->
          <line x1="${hx}" y1="24" x2="${hx}" y2="${openY}" stroke="${stroke}" stroke-width="2.5" stroke-linecap="round" />
          <!-- Дуга траектории -->
          <path d="M ${closedX} 24 A 44 20 0 0 ${sweep} ${hx} ${openY}" fill="none" stroke="${arcColor}" stroke-width="1.5" stroke-dasharray="3,2" />
          <!-- Подпись Снаружи/Внутри -->
          <text x="40" y="${dir === 'out' ? 15 : 41}" text-anchor="middle" font-size="7" fill="#64748b">${dir === 'out' ? 'НАРУЖУ ↓' : 'ВНУТРЬ ↑'}</text>
        </svg>
      `;
    },

    // ОБЩАЯ ИЛЛЮСТРАЦИЯ ЗАМЕРА + КРАТКОЕ ОПИСАНИЕ
    renderMasterIllustration(m) {
      const openW = Number(m.openWidth) || 0;
      const openH = m.diffLevel
        ? Math.min(Number(m.openHeightOut) || 0, Number(m.openHeightIn) || 0)
        : (Number(m.openHeight) || 0);
      const heightLabel = m.diffLevel
        ? (m.openHeightOut || m.openHeightIn ? `Снар: ${m.openHeightOut || '—'} / Внутр: ${m.openHeightIn || '—'}` : '—')
        : (m.openHeight ? `${m.openHeight} мм` : '—');

      const oldW = Number(m.oldWidth) || 0;
      const oldH = Number(m.oldHeight) || 0;
      const slopeW = Number(m.slopeWidth) || 0;
      const slopeH = Number(m.slopeHeight) || 0;

      const recW = Number(m.recWidth) || 0;
      const recH = Number(m.recHeight) || 0;
      const casing = Number(m.casingProjection) || 0;
      const totalCasingW = (recW && casing) ? (recW + casing * 2) : 0;
      const totalCasingH = (recH && casing) ? (recH + casing) : 0;

      const sideObj = OPENING_SIDES.find(s => s.id === m.recSide) || null;
      const hingeLeft = sideObj ? sideObj.hinge === 'left' : null;

      // Расчёт зазоров
      const gapW = (openW && recW) ? (openW - recW) : null;
      const gapH = (openH && recH) ? (openH - recH) : null;

      return `
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-3">
          <svg viewBox="0 0 320 265" class="w-full h-auto mx-auto">
            <!-- Легенда слоёв сверху -->
            <g font-size="8.5" font-family="Arial, sans-serif">
              <rect x="8" y="6" width="10" height="6" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
              <text x="22" y="12" fill="#334155">Проём</text>

              <rect x="65" y="6" width="10" height="6" fill="none" stroke="#9333ea" stroke-width="1.5" stroke-dasharray="2,2"/>
              <text x="79" y="12" fill="#334155">Старая / Откос</text>

              <rect x="155" y="6" width="10" height="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
              <text x="169" y="12" fill="#334155">Новая коробка</text>

              <rect x="242" y="6" width="10" height="6" fill="none" stroke="#059669" stroke-width="1.8"/>
              <text x="256" y="12" fill="#334155">Наличник</text>
            </g>

            <!-- 1. Контур старого откоса / старого наличника (фиолетовый пунктир, если указан) -->
            ${(slopeW || slopeH || oldW || oldH) ? `
              <rect x="52" y="26" width="146" height="196" fill="none" stroke="#9333ea" stroke-width="1.3" stroke-dasharray="2,2" />
              <text x="125" y="24" text-anchor="middle" font-size="8" fill="#7e22ce">
                ${slopeW || slopeH ? `Откос: ${slopeW || '—'}×${slopeH || '—'}` : `Старая: ${oldW || '—'}×${oldH || '—'}`}
              </text>
            ` : ''}

            <!-- 2. Контур строительного проёма (красный штрих) -->
            <rect x="62" y="36" width="126" height="184" fill="#fee2e2" fill-opacity="0.25" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5,3" />
            <text x="125" y="47" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#b91c1c">
              Проём: ${openW || '—'} × ${m.diffLevel ? (m.openHeightOut || '—') + '/' + (m.openHeightIn || '—') : (openH || '—')}
            </text>

            <!-- 3. Внешний габарит нового наличника (зелёный контур) -->
            <rect x="57" y="31" width="136" height="189" fill="none" stroke="#059669" stroke-width="2" />
            ${totalCasingW ? `
              <text x="125" y="233" text-anchor="middle" font-size="9" font-weight="bold" fill="#047857">
                По наличнику: ${totalCasingW} × ${totalCasingH} мм (вылет +${casing})
              </text>
            ` : ''}

            <!-- 4. Новая дверная коробка (синий основной контур) -->
            <rect x="70" y="49" width="110" height="171" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5" />

            <!-- Размеры новой коробки в центре полотна -->
            <text x="125" y="122" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a8a">
              ${recW ? recW : 'Ш?'} × ${recH ? recH : 'В?'}
            </text>
            <text x="125" y="135" text-anchor="middle" font-size="8.5" fill="#475569">
              ${m.recSide || 'Сторона не выбрана'}
            </text>

            <!-- Отрисовка петель и ручки на полотне, если выбрана сторона -->
            ${hingeLeft !== null ? `
              <!-- Петли -->
              <rect x="${hingeLeft ? 68 : 178}" y="68" width="4" height="14" rx="1" fill="#0f172a" />
              <rect x="${hingeLeft ? 68 : 178}" y="182" width="4" height="14" rx="1" fill="#0f172a" />
              <!-- Ручка на противоположной стороне -->
              <circle cx="${hingeLeft ? 168 : 82}" cy="134" r="3.5" fill="#1d4ed8" />
              <line x1="${hingeLeft ? 168 : 82}" y1="134" x2="${hingeLeft ? 156 : 94}" y2="134" stroke="#1d4ed8" stroke-width="2.5" stroke-linecap="round" />
            ` : ''}

            <!-- Боковая мини-схема открывания (вид сверху) справа от двери -->
            <g transform="translate(212, 75)">
              <rect x="0" y="0" width="98" height="95" rx="6" fill="#ffffff" stroke="#cbd5e1" />
              <text x="49" y="14" text-anchor="middle" font-size="8.5" font-weight="bold" fill="#334155">План открывания</text>
              ${sideObj ? `
                <g transform="translate(9, 20)">
                  ${this.renderOpeningMiniSvg(sideObj.hinge, sideObj.dir, true)}
                </g>
                <text x="49" y="84" text-anchor="middle" font-size="8" font-weight="bold" fill="#1d4ed8">${sideObj.short}</text>
              ` : `
                <text x="49" y="52" text-anchor="middle" font-size="8" fill="#94a3b8">Выберите сторону</text>
              `}
            </g>

            <!-- Толщина стены -->
            <text x="261" y="192" text-anchor="middle" font-size="8.5" fill="#475569">
              Стена: ${m.wallDepth ? m.wallDepth + ' мм' : '—'}
            </text>
          </svg>

          <!-- КРАТКОЕ ТЕКСТОВОЕ ОПИСАНИЕ ПОД ИЛЛЮСТРАЦИЕЙ -->
          <div class="mt-2 pt-2.5 border-t border-slate-200 text-xs space-y-1 text-slate-700">
            <div>• <strong>Проём:</strong> ${openW || '—'} × ${heightLabel}${m.wallDepth ? `, толщ. стены ${m.wallDepth} мм` : ''}</div>
            ${(oldW || oldH || m.oldFrameDepth || m.oldSide) ? `
              <div>• <strong>Старая дверь:</strong> ${oldW || '—'} × ${oldH || '—'} мм${m.oldFrameDepth ? ` (коробка ${m.oldFrameDepth} мм)` : ''}${m.oldSide ? `, ${m.oldSide}` : ''}</div>
            ` : ''}
            ${(slopeW || slopeH) ? `
              <div>• <strong>Старый откос / наличник:</strong> ${slopeW || '—'} × ${slopeH || '—'} мм</div>
            ` : ''}
            <div>• <strong>Новая дверь (коробка):</strong> <span class="text-blue-700 font-bold">${recW || '—'} × ${recH || '—'} мм</span>, ${m.recSide || 'открывание не указано'}</div>
            <div>• <strong>Габарит по наличнику:</strong> ${totalCasingW ? `<span class="text-emerald-700 font-bold">${totalCasingW} × ${totalCasingH} мм</span> (вылет ${casing} мм)` : (m.casingProjection ? `вылет ${m.casingProjection} мм` : 'не указан')}</div>
            ${(gapW !== null || gapH !== null) ? `
              <div class="text-[11px] text-slate-500 pt-0.5">
                Монтажный зазор: ${gapW !== null ? `по ширине ${gapW > 0 ? '+' + gapW : gapW} мм (${Math.round(gapW/2)} мм/стор.)` : ''} ${gapH !== null ? `· по высоте ${gapH > 0 ? '+' + gapH : gapH} мм` : ''}
              </div>
            ` : ''}
          </div>
        </div>
      `;
    },

    getCasingOptionsHtml(category, selectedVal) {
      let list = [];
      if (category === 'outdoor') {
        list = CASING_OUTDOOR;
      } else if (category === 'apartment') {
        list = CASING_APARTMENT;
      } else {
        list = Array.from(new Set([...CASING_APARTMENT, ...CASING_OUTDOOR])).sort((a, b) => a - b);
      }
      return list.map(v => `
        <option value="${v}" ${String(selectedVal) === String(v) ? 'selected' : ''}>${v} мм ${v === 67 ? '(Стандарт по умолчанию)' : ''}</option>
      `).join('');
    },

    bindEvents(container) {
      const saveAll = () => {
        const prev = AppCore.getState('ext_measure') || {};
        const diffLevel = container.querySelector('#m-diffLevel').checked;

        const updated = {
          ...prev,
          diffLevel,
          openWidth: container.querySelector('#m-openWidth').value.trim(),
          openHeight: container.querySelector('#m-openHeight').value.trim(),
          openHeightOut: container.querySelector('#m-openHeightOut').value.trim(),
          openHeightIn: container.querySelector('#m-openHeightIn').value.trim(),
          wallDepth: container.querySelector('#m-wallDepth').value.trim(),
          oldWidth: container.querySelector('#m-oldWidth').value.trim(),
          oldHeight: container.querySelector('#m-oldHeight').value.trim(),
          oldFrameDepth: container.querySelector('#m-oldFrameDepth').value.trim(),
          oldSide: container.querySelector('#m-oldSide').value,
          slopeWidth: container.querySelector('#m-slopeWidth').value.trim(),
          slopeHeight: container.querySelector('#m-slopeHeight').value.trim(),
          recWidth: container.querySelector('#m-recWidth').value,
          recHeight: container.querySelector('#m-recHeight').value,
          recSide: container.querySelector('#m-recSide').value,
          doorCategory: container.querySelector('#m-doorCategory').value,
          casingProjection: container.querySelector('#m-casingProjection').value,
          notes: container.querySelector('#m-notes').value
        };

        AppCore.updateState('ext_measure', updated);

        // Живое обновление общей иллюстрации и описания без потери фокуса ввода
        const illBox = container.querySelector('#master-illustration-box');
        if (illBox) illBox.innerHTML = this.renderMasterIllustration(updated);

        const badge = container.querySelector('#ext-m-save-badge');
        if (badge) {
          badge.classList.remove('opacity-0');
          clearTimeout(this._saveTimer);
          this._saveTimer = setTimeout(() => badge.classList.add('opacity-0'), 1200);
        }
      };

      // Сворачивание / разворачивание блоков 2, 3 и 5
      container.querySelectorAll('[data-toggle-sec]').forEach(btn => {
        btn.addEventListener('click', () => {
          const sec = btn.dataset.toggleSec;
          this.uiCollapsed[sec] = !this.uiCollapsed[sec];
          this.render(container, AppCore.getState());
        });
      });

      // Схематичные кнопки выбора стороны открывания
      container.querySelectorAll('.side-card-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const val = btn.dataset.sideVal;
          const hiddenInput = container.querySelector('#m-recSide');
          // Повторный клик снимает выбор, если нужно оставить пустым
          hiddenInput.value = (hiddenInput.value === val) ? '' : val;
          saveAll();
          this.render(container, AppCore.getState());
        });
      });

      // Чекбокс разных уровней высоты проёма
      container.querySelector('#m-diffLevel').addEventListener('change', () => {
        saveAll();
        this.render(container, AppCore.getState());
      });

      // Переключение категории двери для вылета наличника
      const catSelect = container.querySelector('#m-doorCategory');
      catSelect.addEventListener('change', () => {
        const currentProj = container.querySelector('#m-casingProjection').value;
        const newCat = catSelect.value;
        const projSelect = container.querySelector('#m-casingProjection');
        const validSet = newCat === 'outdoor' ? CASING_OUTDOOR : (newCat === 'apartment' ? CASING_APARTMENT : []);
        let nextVal = currentProj;
        if (currentProj && validSet.length && !validSet.includes(Number(currentProj))) {
          nextVal = '67';
        }
        projSelect.innerHTML = `<option value="" ${!nextVal ? 'selected' : ''}></option>` + this.getCasingOptionsHtml(newCat, nextVal);
        saveAll();
      });

      // Автосохранение всех инпутов
      container.querySelectorAll('.m-input').forEach(el => {
        el.addEventListener('input', saveAll);
        el.addEventListener('change', saveAll);
      });

      // Автоподбор размера новой двери по проёму
      container.querySelector('#btn-auto-recommend').addEventListener('click', () => {
        const m = AppCore.getState('ext_measure') || {};
        const openW = Number(m.openWidth);
        const openH = m.diffLevel
          ? Math.min(Number(m.openHeightOut) || 9999, Number(m.openHeightIn) || 9999)
          : Number(m.openHeight);

        if (!openW && (!openH || openH === 9999)) {
          alert('Сначала введите ширину или высоту проёма в разделе 1.');
          return;
        }

        if (openW) {
          const cW = WIDTH_OPTIONS.filter(w => w <= openW - 20);
          container.querySelector('#m-recWidth').value = cW.length ? String(cW[cW.length - 1]) : String(WIDTH_OPTIONS[0]);
        }
        if (openH && openH !== 9999) {
          const cH = HEIGHT_OPTIONS.filter(h => h <= openH - 15);
          container.querySelector('#m-recHeight').value = cH.length ? String(cH[cH.length - 1]) : String(HEIGHT_OPTIONS[0]);
        }
        if (!container.querySelector('#m-recSide').value && m.oldSide) {
          container.querySelector('#m-recSide').value = m.oldSide;
        }
        saveAll();
        this.render(container, AppCore.getState());
      });

      // КНОПКА 1: «Сделать фото» (Камера + сохранение в замер + скачивание копии в галерею телефона)
      container.querySelector('#input-camera-shot').addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        // 1. Сохраняем оригинал фото в память/галерею телефона, чтобы снимок с камеры не пропал
        this.saveFileToPhoneGallery(file);

        // 2. Сжимаем и добавляем в замер
        const compressed = await this.compressImage(file, 1100, 0.8);
        const m = AppCore.getState('ext_measure') || {};
        const photos = Array.isArray(m.photos) ? [...m.photos] : [];
        photos.push({ id: Date.now() + Math.random(), dataUrl: compressed });
        AppCore.updateState('ext_measure', { photos });
        this.render(container, AppCore.getState());
      });

      // КНОПКА 2: «Добавить фото» (Выбор из галереи без автоскачивания)
      container.querySelector('#input-gallery-add').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        const m = AppCore.getState('ext_measure') || {};
        const photos = Array.isArray(m.photos) ? [...m.photos] : [];

        for (const file of files) {
          const compressed = await this.compressImage(file, 1100, 0.8);
          photos.push({ id: Date.now() + Math.random(), dataUrl: compressed });
        }
        AppCore.updateState('ext_measure', { photos });
        this.render(container, AppCore.getState());
      });

      // Удаление фото
      container.querySelectorAll('[data-del-photo]').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.dataset.delPhoto);
          const m = AppCore.getState('ext_measure') || {};
          const photos = (m.photos || []).filter((_, i) => i !== idx);
          AppCore.updateState('ext_measure', { photos });
          this.render(container, AppCore.getState());
        });
      });

      // ПЕЧАТЬ 1: Полностью пустой бланк А4 пополам (даже ФИО и адрес заполняются от руки)
      container.querySelector('#btn-print-blank-a5').addEventListener('click', () => {
        this.printBlankHalfA4();
      });

      // ПЕЧАТЬ 2: Заполненный замерочный лист со схемой
      container.querySelector('#btn-print-filled').addEventListener('click', () => {
        this.printFilledSheet(AppCore.getState());
      });

      // Ключ ИИ для чтения рукописного бланка
      container.querySelector('#btn-ocr-settings').addEventListener('click', () => {
        const currentKey = localStorage.getItem('DOOR_ECO_GEMINI_KEY') || '';
        const newKey = prompt('Вставьте API-ключ Google Gemini для автоматического чтения рукописного бланка по фото:', currentKey);
        if (newKey !== null) localStorage.setItem('DOOR_ECO_GEMINI_KEY', newKey.trim());
      });

      // Загрузка фото заполненного от руки бланка
      container.querySelector('#input-ocr-sheet').addEventListener('change', async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        await this.processHandwrittenSheetPhoto(file, container);
        e.target.value = '';
      });
    },

    // Сохранение сделанного камерой снимка в галерею/загрузки телефона
    saveFileToPhoneGallery(file) {
      try {
        const clientName = (AppCore.getState('client')?.fullName || 'Zamer').replace(/\s+/g, '_');
        const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
        const url = URL.createObjectURL(file);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Foto_${clientName}_${stamp}.jpg`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 3000);
      } catch (err) {
        console.warn('Не удалось автоматически сохранить копию в галерею:', err);
      }
    },

    // ПЕЧАТЬ 1: АБСОЛЮТНО ПУСТОЙ БЛАНК А4 ПОПОЛАМ (включая пустые строки под ФИО и адрес)
    printBlankHalfA4() {
      const renderBlankHalf = () => `

          <div>

              <span style="font-size: 10.5px;">Дата: «____» ____________ 202__ г.</span>
            </div>

            <!-- Пустые графы клиента для заполнения от руки -->
            <div style="display: grid; grid-template-columns: 1.3fr 1fr; gap: 5px; margin-bottom: 6px; font-size: 10.5px;">
              <div><strong>ФИО клиента:</strong> _____________________________________</div>
              <div><strong>Тел.:</strong> ___________________________</div>
              <div><strong>Адрес:</strong> ___________________________________________</div>

            </div>

            <table style="width: 100%; border-collapse: collapse; margin-bottom: 6px; font-size: 10.5px;">
              <tr>
                <td style="border: 1px solid #000; padding: 4px; width: 34%; vertical-align: top;">
                  <strong>1. РАЗМЕР ПРОЁМА (мм)</strong><br>
                  Ширина [Ш_ПРОЕМА]: __________<br>
                  Высота общая [В_ПРОЕМА]: _____<br>
                  Высота СНАР [В_СНАРУЖИ]: _____<br>
                  Высота ВНУТР [В_ВНУТРИ]: _____<br>
                  Толщ. стены [Г_СТЕНЫ]: ________
                </td>
                <td style="border: 1px solid #000; padding: 4px; width: 33%; vertical-align: top;">
                  <strong>2. СТАРАЯ ДВЕРЬ (мм)</strong><br>

                  Толщ. кор. [СТ_КОР]: _________<br>
                  Откр.: [ ] Нар.Л &nbsp;[ ] Нар.П<br>
                  &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;[ ] Вн.Л &nbsp;&nbsp;[ ] Вн.П
                </td>
                <td style="border: 1px solid #000; padding: 4px; width: 33%; vertical-align: top;">
                  <strong>3. РАЗМЕР ПО ОТКОСУ (мм)</strong><br>
                  Ширина [ОТК_Ш]: ____________<br>
                  Высота [ОТК_В]: ____________<br><br>
                  <strong>5. ВЫЛЕТ НАЛИЧНИКА</strong><br>
                  [ ] Улич. (17-97) [ ] Кварт. (15-105)<br>
                  Вылет [НАЛИЧНИК]: _____ мм (ст.67)
                </td>
              </tr>
            </table>

            <div style="border: 1.5px solid #000; padding: 5px; margin-bottom: 6px; font-size: 11px;">
              <strong>4. РЕКОМЕНДУЕМЫЙ РАЗМЕР НОВОЙ ДВЕРИ (860 / 950 × 2050, шаг ±30 мм):</strong>
              <div style="margin-top: 4px; display: flex; justify-content: space-between;">
                <span>Ширина [НОВ_Ш]: ___________ мм</span>
                <span>Высота [НОВ_В]: ___________ мм</span>
                <span>Откр.: [ ] Нар.Л &nbsp;[ ] Нар.П &nbsp;[ ] Вн.Л &nbsp;[ ] Вн.П</span>
              </div>
            </div>

            <div style="border: 1px solid #000; padding: 4px; height: 20mm; font-size: 10px;">
              <strong>Примечания / Доп. работы:</strong>
            </div>
          </div>

          <div style="font-size: 9.5px; display: flex; justify-content: space-between;">
            <span>Замерщик: _______________________</span>
            <span>Заказчик: _______________________</span>
          </div>
        </div>
      `;

      AppCore.printHtml(`
        <div style="width: 100%; box-sizing: border-box;">
          ${renderBlankHalf()}
          <div style="border-top: 1px dashed #666; margin: 3mm 0; text-align: center; font-size: 9px; color: #666;">
            ✂ Линия разреза (Формат А4 пополам)
          </div>
          ${renderBlankHalf()}
        </div>
      `);
    },

    // ПЕЧАТЬ 2: ЗАПОЛНЕННЫЙ ЗАМЕРОЧНЫЙ ЛИСТ С ИЛЛЮСТРАЦИЕЙ
    printFilledSheet(fullState) {
      const c = fullState.client || {};
      const m = fullState.ext_measure || {};
      const photos = Array.isArray(m.photos) ? m.photos : [];

      const heightText = m.diffLevel
        ? `Снаружи: ${this.esc(m.openHeightOut || '—')} мм / Внутри: ${this.esc(m.openHeightIn || '—')} мм`
        : `${this.esc(m.openHeight || '—')} мм`;

      const html = `
        <div style="font-family: Arial, sans-serif; color: #000; font-size: 12px; line-height: 1.35;">
          <div style="display:flex; justify-content:space-between; align-items:flex-end; border-bottom: 2px solid #000; padding-bottom: 6px; margin-bottom: 10px;">
            <div>
              <h1 style="font-size: 17px; font-weight: bold; margin: 0;">ЗАМЕРОЧНЫЙ ЛИСТ ВХОДНОЙ ДВЕРИ</h1>
              <div style="font-size: 10.5px; color: #333;">Фирменный салон дверей «Стальная линия»</div>
            </div>
            <div style="font-size: 11px;">Дата: ${new Date().toLocaleDateString('ru-RU')}</div>
          </div>

          <table style="width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 11.5px;">
            <tr>
              <td style="border: 1px solid #000; padding: 5px; width: 55%;"><strong>Клиент:</strong> ${this.esc(c.fullName || '—')}</td>
              <td style="border: 1px solid #000; padding: 5px; width: 45%;"><strong>Телефон:</strong> ${this.esc(c.phone || '—')}</td>
            </tr>
            <tr>
              <td style="border: 1px solid #000; padding: 5px;"><strong>Адрес:</strong> ${this.esc(c.address || '—')}</td>
              <td style="border: 1px solid #000; padding: 5px;"><strong>Этаж / Лифт:</strong> ${this.esc(c.floor || '—')} (${c.elevatorType === 'cargo' ? 'Грузовой' : c.elevatorType === 'passenger' ? 'Пассажирский' : 'Без лифта'})</td>
            </tr>
          </table>

          <div style="display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 10px; align-items: start; margin-bottom: 10px;">
            <table style="width: 100%; border-collapse: collapse; font-size: 11.5px;">
              <tr>
                <td style="border: 1px solid #000; padding: 6px; font-weight: bold; width: 38%;">1. Проём</td>
                <td style="border: 1px solid #000; padding: 6px;">
                  Ш: <strong>${this.esc(m.openWidth || '—')} мм</strong> | В: <strong>${heightText}</strong><br>
                  Толщина стены: <strong>${this.esc(m.wallDepth || '—')} мм</strong>
                </td>
              </tr>
              <tr>
                <td style="border: 1px solid #000; padding: 6px; font-weight: bold;">2. Старая дверь</td>
                <td style="border: 1px solid #000; padding: 6px;">
                  ${(m.oldWidth || m.oldHeight || m.oldFrameDepth || m.oldSide)
                    ? `Ш: <strong>${this.esc(m.oldWidth || '—')}</strong> × В: <strong>${this.esc(m.oldHeight || '—')} мм</strong>, кор.: <strong>${this.esc(m.oldFrameDepth || '—')} мм</strong><br>Откр.: <strong>${this.esc(m.oldSide || '—')}</strong>`
                    : '—'}
                </td>
              </tr>
              <tr>
                <td style="border: 1px solid #000; padding: 6px; font-weight: bold;">3. По откосу</td>
                <td style="border: 1px solid #000; padding: 6px;">
                  ${(m.slopeWidth || m.slopeHeight) ? `Ш: <strong>${this.esc(m.slopeWidth || '—')}</strong> × В: <strong>${this.esc(m.slopeHeight || '—')} мм</strong>` : '—'}
                </td>
              </tr>
              <tr>
                <td style="border: 1px solid #000; padding: 6px; font-weight: bold;">4. Новая дверь</td>
                <td style="border: 1px solid #000; padding: 6px; font-size: 12.5px;">
                  Коробка: <strong>${this.esc(m.recWidth || '—')} × ${this.esc(m.recHeight || '—')} мм</strong><br>
                  Открывание: <strong>${this.esc(m.recSide || '—')}</strong>
                </td>
              </tr>
              <tr>
                <td style="border: 1px solid #000; padding: 6px; font-weight: bold;">5. Наличник</td>
                <td style="border: 1px solid #000; padding: 6px;">
                  Вылет: <strong>${this.esc(m.casingProjection || '—')} мм</strong>
                  ${(m.recWidth && m.recHeight && m.casingProjection) ? `<br>Габарит по наличнику: <strong>${Number(m.recWidth) + Number(m.casingProjection)*2} × ${Number(m.recHeight) + Number(m.casingProjection)} мм</strong>` : ''}
                </td>
              </tr>
            </table>

            <div style="border: 1px solid #000; padding: 4px;">
              ${this.renderMasterIllustration(m)}
            </div>
          </div>

          <div style="border: 1px solid #000; padding: 6px; min-height: 16mm; margin-bottom: 10px; font-size: 11.5px;">
            <strong>Примечания / Доп. работы:</strong> ${this.esc(m.notes || '—')}
          </div>

          ${photos.length > 0 ? `
            <div style="margin-bottom: 10px;">
              <strong style="display:block; margin-bottom: 4px; font-size: 11px;">Фотофиксация:</strong>
              <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;">
                ${photos.slice(0, 4).map(ph => `<img src="${ph.dataUrl}" style="width: 100%; height: 34mm; object-fit: cover; border: 1px solid #999;">`).join('')}
              </div>
            </div>
          ` : ''}

          <div style="display: flex; justify-content: space-between; margin-top: 16px; font-size: 11.5px;">
            <div>Замер произвёл: _______________________</div>
            <div>С замером ознакомлен: _______________________</div>
          </div>
        </div>
      `;
      AppCore.printHtml(html);
    },

    // Распознавание сфотографированного рукописного бланка (включая ФИО, телефон и адрес)
    async processHandwrittenSheetPhoto(file, container) {
      const statusBox = container.querySelector('#ocr-status-box');
      const statusText = container.querySelector('#ocr-status-text');
      statusBox.classList.remove('hidden');
      statusText.textContent = '⏳ Обработка фото рукописного бланка...';

      try {
        const dataUrl = await this.compressImage(file, 1400, 0.85);
        const m = AppCore.getState('ext_measure') || {};
        const photos = Array.isArray(m.photos) ? [...m.photos] : [];
        photos.unshift({ id: Date.now(), dataUrl });
        AppCore.updateState('ext_measure', { photos });

        const apiKey = localStorage.getItem('DOOR_ECO_GEMINI_KEY');
        if (!apiKey) {
          this.render(container, AppCore.getState());
          alert('Фото бланка добавлено в замер! Чтобы программа сама считывала рукописный почерк и заполняла поля, нажмите кнопку «⚙️ Ключ ИИ» и укажите ключ Gemini.');
          return;
        }

        statusText.textContent = '🤖 ИИ считывает рукописные данные клиента и размеры с бланка...';
        const parsed = await this.parseWithGeminiVision(dataUrl, apiKey);

        if (parsed) {
          // Если на бланке от руки написаны ФИО, телефон или адрес — обновляем и карточку клиента
          const clientPatch = {};
          if (parsed.fullName) clientPatch.fullName = String(parsed.fullName).trim();
          if (parsed.phone) clientPatch.phone = String(parsed.phone).trim();
          if (parsed.address) clientPatch.address = String(parsed.address).trim();
          if (parsed.floor) clientPatch.floor = String(parsed.floor).trim();
          if (Object.keys(clientPatch).length > 0) {
            AppCore.updateState('client', clientPatch);
          }

          const measurePatch = {};
          const keys = ['openWidth','openHeight','openHeightOut','openHeightIn','wallDepth','oldWidth','oldHeight','oldFrameDepth','oldSide','slopeWidth','slopeHeight','recWidth','recHeight','recSide','doorCategory','casingProjection','notes'];
          keys.forEach(k => {
            if (parsed[k] !== undefined && parsed[k] !== null && String(parsed[k]).trim() !== '') {
              measurePatch[k] = String(parsed[k]).trim();
            }
          });
          if (measurePatch.openHeightOut || measurePatch.openHeightIn) measurePatch.diffLevel = true;

          // Автоматически разворачиваем секции, если на бланке были заполнены их поля
          if (measurePatch.oldWidth || measurePatch.oldHeight) this.uiCollapsed.oldDoor = false;
          if (measurePatch.slopeWidth || measurePatch.slopeHeight) this.uiCollapsed.slope = false;
          if (measurePatch.casingProjection) this.uiCollapsed.casing = false;

          AppCore.updateState('ext_measure', measurePatch);
          this.render(container, AppCore.getState());
          alert('Рукописный бланк распознан! Данные перенесены в программу.');
        }
      } catch (err) {
        statusBox.classList.add('hidden');
        alert('Ошибка распознавания: ' + err.message);
      }
    },

    async parseWithGeminiVision(dataUrl, apiKey) {
      const base64Data = dataUrl.split(',')[1];
      const prompt = `Проанализируй фото рукописного замерочного бланка входной двери и верни ТОЛЬКО чистый JSON (если поле не заполнено — пустая строка ""):
      {
        "fullName": "ФИО клиента от руки",
        "phone": "телефон клиента",
        "address": "адрес",
        "floor": "этаж",
        "openWidth": "число мм [Ш_ПРОЕМА]",
        "openHeight": "число мм [В_ПРОЕМА]",
        "openHeightOut": "число мм [В_СНАРУЖИ]",
        "openHeightIn": "число мм [В_ВНУТРИ]",
        "wallDepth": "число мм [Г_СТЕНЫ]",
        "oldWidth": "число мм [СТ_Ш]",
        "oldHeight": "число мм [СТ_В]",
        "oldFrameDepth": "число мм [СТ_КОР]",
        "oldSide": "Наружное Левое | Наружное Правое | Внутреннее Левое | Внутреннее Правое",
        "slopeWidth": "число мм [ОТК_Ш]",
        "slopeHeight": "число мм [ОТК_В]",
        "recWidth": "число мм [НОВ_Ш]",
        "recHeight": "число мм [НОВ_В]",
        "recSide": "Наружное Левое | Наружное Правое | Внутреннее Левое | Внутреннее Правое",
        "doorCategory": "outdoor | apartment",
        "casingProjection": "число мм [НАЛИЧНИК]",
        "notes": "примечания"
      }`;

      const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: 'image/jpeg', data: base64Data } }] }]
        })
      });
      if (!resp.ok) throw new Error('Проверьте API-ключ Gemini');
      const json = await resp.json();
      const rawText = json.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
      return JSON.parse(rawText.replace(/```json|```/g, '').trim());
    },

    compressImage(file, maxWidth, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    },

    esc(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }
  });

  if (window.AppCore && AppCore.activeTab === 'ext_measure') {
    AppCore.switchTab('ext_measure');
  }
})();
</script>
